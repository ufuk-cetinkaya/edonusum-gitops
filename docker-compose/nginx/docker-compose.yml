
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf
    - ./html:/usr/share/nginx/html
    - ./certs:/etc/nginx/certs
    networks:
    - edonusum

networks:
  edonusum:
    external: true 