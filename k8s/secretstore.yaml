apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://192.168.1.106:8200"
      path: "sqlserver"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-secret
          namespace: vault
          key: token