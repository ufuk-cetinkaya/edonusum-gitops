apiVersion: batch/v1
kind: Job
metadata:
  name: ebelgedb-migration
spec:
  template:
    spec:
      containers:
      - name: envelope-api
        image: ghcr.io/ufuk-cetinkaya/envelope-api:latest
        imagePullPolicy: IfNotPresent
        args: ["migrate"]
        envFrom:
        - secretRef:
            name: envelope-api-secret
      restartPolicy: Never